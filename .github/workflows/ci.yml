name: CI

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  validate:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm run type-check

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_CONTENTSTACK_API_KEY: ${{ secrets.NEXT_PUBLIC_CONTENTSTACK_API_KEY }}
          NEXT_PUBLIC_CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTSTACK_DELIVERY_TOKEN }}
          NEXT_PUBLIC_CONTENTSTACK_PREVIEW_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTSTACK_PREVIEW_TOKEN }}
          NEXT_PUBLIC_CONTENTSTACK_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_CONTENTSTACK_ENVIRONMENT || 'production' }}
          NEXT_PUBLIC_CONTENTSTACK_REGION: ${{ secrets.NEXT_PUBLIC_CONTENTSTACK_REGION || 'EU' }}
          NEXT_PUBLIC_CONTENTSTACK_PREVIEW: 'false'
          NEXT_PUBLIC_CONTENTSTACK_IMAGE_HOSTNAME: 'eu-images.contentstack.com'
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_SITE_URL: 'https://www.edwinschipper.nl'
        run: pnpm run build
